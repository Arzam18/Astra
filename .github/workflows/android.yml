    - name: Download SIMDe and Patch for ARM64
      run: |
        # 1. Clone SIMDe and copy its headers directly into src/
        git clone https://github.com/simd-everywhere/simde.git
        cp -r simde/simde src/

        # 2. Patch simd.h to use SIMDe's AVX2 translation on ARM64
        python3 -c "
        import os

        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.lower() == 'simd.h':
                    path = os.path.join(root, file)
                    with open(path, 'r') as f:
                        content = f.read()

                    # Enable SIMDe AVX2 native aliases for ARM
                    if '#include <immintrin.h>' in content:
                        replacement = '''#if defined(__aarch64__) || defined(__ARM_NEON)
        #define SIMDE_ENABLE_NATIVE_ALIASES
        #include \"simde/x86/avx2.h\"
        #include \"simde/x86/fma.h\"
        #else
        #include <immintrin.h>
        #endif'''
                        content = content.replace('#include <immintrin.h>', replacement)

                    # Ensure ivec_t and fvec_t are defined for ARM64
                    content = content.replace(
                        '#elif defined(__AVX2__) || defined(__AVX__)',
                        '#elif defined(__AVX2__) || defined(__AVX__) || defined(__aarch64__) || defined(__ARM_NEON)'
                    )

                    with open(path, 'w') as f:
                        f.write(content)
        "
