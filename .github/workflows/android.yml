name: Build Astra for Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract engine version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev-${GITHUB_SHA::7}")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building Astra version: ${VERSION}"

      - name: Download Network Weight File
        run: |
          WEIGHTS_FILE="weights-v5-perm.nnue"
          WEIGHTS_URL="https://github.com/h1me01/Astra-Networks/releases/download/weights/${WEIGHTS_FILE}"
          curl -sL "$WEIGHTS_URL" -o "$WEIGHTS_FILE"

      - name: Setup SIMDe and Globally Patch x86 Headers & Shifts for ARM64
        run: |
          # Download SIMDe headers to root directory
          git clone --depth 1 https://github.com/simd-everywhere/simde.git

          python3 -c '
          import os

          x86_headers = [
              "<immintrin.h>", "<xmmintrin.h>", "<emmintrin.h>", 
              "<mmintrin.h>", "<nmmintrin.h>", "<smmintrin.h>", 
              "<tmmintrin.h>", "<pmmintrin.h>"
          ]

          def patch_file(path):
              if "simde" in path.split(os.sep):
                  return

              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              original = content

              # Globally replace any x86 intrinsic header with SIMDe equivalents on ARM64
              for header in x86_headers:
                  target = f"#include {header}"
                  if target in content:
                      simde_block = f"""#if defined(__aarch64__) || defined(__ARM_NEON)
          #define SIMDE_ENABLE_NATIVE_ALIASES
          #include "simde/x86/avx2.h"
          #include "simde/x86/fma.h"
          #else
          {target}
          #endif"""
                      content = content.replace(target, simde_block)

              # Patch simd.h for ARM64 vector types and complete function replacement for shifts
              if "simd.h" in path.lower():
                  content = content.replace(
                      "#elif defined(__AVX2__) || defined(__AVX__)",
                      "#elif defined(__AVX2__) || defined(__AVX__) || defined(__aarch64__) || defined(__ARM_NEON)"
                  )

                  def generate_switch_function(func_name, intrinsic_name, max_imm):
                      cases = []
                      for i in range(max_imm + 1):
                          cases.append(f"        case {i}: return {intrinsic_name}(a, {i});")
                      cases_str = "\n".join(cases)
                      return f"""#if defined(__aarch64__) || defined(__ARM_NEON)
          inline ivec_t {func_name}(ivec_t a, int imm) {{
              switch(imm) {{
          {cases_str}
                  default: return {intrinsic_name}(a, 0);
              }}
          }}
          #else
          inline ivec_t {func_name}(ivec_t a, int imm) {{ return {intrinsic_name}(a, imm); }}
          #endif"""

                  content = content.replace(
                      "inline ivec_t slli_epi16(ivec_t a, int imm) { return _mm256_slli_epi16(a, imm); }",
                      generate_switch_function("slli_epi16", "_mm256_slli_epi16", 15)
                  )
                  content = content.replace(
                      "inline ivec_t srli_epi16(ivec_t a, int imm) { return _mm256_srli_epi16(a, imm); }",
                      generate_switch_function("srli_epi16", "_mm256_srli_epi16", 15)
                  )
                  content = content.replace(
                      "inline ivec_t srai_epi16(ivec_t a, int imm) { return _mm256_srai_epi16(a, imm); }",
                      generate_switch_function("srai_epi16", "_mm256_srai_epi16", 15)
                  )
                  content = content.replace(
                      "inline ivec_t slli_epi32(ivec_t a, int imm) { return _mm256_slli_epi32(a, imm); }",
                      generate_switch_function("slli_epi32", "_mm256_slli_epi32", 31)
                  )
                  content = content.replace(
                      "inline ivec_t srli_epi32(ivec_t a, int imm) { return _mm256_srli_epi32(a, imm); }",
                      generate_switch_function("srli_epi32", "_mm256_srli_epi32", 31)
                  )
                  content = content.replace(
                      "inline ivec_t srai_epi32(ivec_t a, int imm) { return _mm256_srai_epi32(a, imm); }",
                      generate_switch_function("srai_epi32", "_mm256_srai_epi32", 31)
                  )

              # Patch util.h for _mm_malloc / _mm_free and std::aligned_alloc fallbacks
              if "util.h" in path.lower() or "util.hpp" in path.lower():
                  if "_mm_malloc" in content or "aligned_alloc" in content:
                      mm_malloc_fallback = """#if defined(__aarch64__) || defined(__ARM_NEON)
          #include <stdlib.h>
          #include <malloc.h>
          inline void* _mm_malloc(size_t size, size_t alignment) {
              void* ptr = nullptr;
              if (posix_memalign(&ptr, alignment, size) != 0) return nullptr;
              return ptr;
          }
          inline void _mm_free(void* ptr) {
              free(ptr);
          }
          #endif
          """
                      content = mm_malloc_fallback + content

                  if "std::aligned_alloc" in content:
                      content = content.replace(
                          "ptr = std::aligned_alloc(Alignment, std::max(alignedBytes, Alignment));",
                          "posix_memalign(&ptr, Alignment, std::max(alignedBytes, Alignment));"
                      )

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched: {path}")

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".h", ".hpp", ".cpp", ".cc", ".c")):
                      patch_file(os.path.join(root, file))
          '

      - name: Build Astra (ARM64 v8-A)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"

          SOURCES=$(find src -type f \( -name "*.cpp" -o -name "*.cc" \))
          if [ -f "third_party/fathom/tbprobe.c" ]; then
            SOURCES="$SOURCES third_party/fathom/tbprobe.c"
          fi

          mkdir -p dist/bin
          echo "Compiling Astra for Android ARM64 v8-A..."
          $NDK_CXX -O3 -flto -std=c++20 -pthread \
            -march=armv8-a \
            -funroll-loops -fomit-frame-pointer -fno-exceptions \
            -DNDEBUG -static-libstdc++ \
            -DNNUE_PATH=\"weights-v5-perm.nnue\" \
            -I. -Isrc -Ithird_party/fathom -I./simde \
            $SOURCES -lm -o dist/bin/astra-${{ env.VERSION }}-android-arm64-v8a

      - name: Build Astra (ARM64 DotProd - Cortex A76+)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"

          SOURCES=$(find src -type f \( -name "*.cpp" -o -name "*.cc" \))
          if [ -f "third_party/fathom/tbprobe.c" ]; then
            SOURCES="$SOURCES third_party/fathom/tbprobe.c"
          fi

          echo "Compiling Astra for Android ARM64 DotProd..."
          $NDK_CXX -O3 -flto -std=c++20 -pthread \
            -march=armv8.2-a+dotprod+crypto \
            -funroll-loops -fomit-frame-pointer -fno-exceptions \
            -DNDEBUG -static-libstdc++ \
            -DNNUE_PATH=\"weights-v5-perm.nnue\" \
            -I. -Isrc -Ithird_party/fathom -I./simde \
            $SOURCES -lm -o dist/bin/astra-${{ env.VERSION }}-android-arm64-dotprod

      - name: Verify Android Binaries
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astra-${{ env.VERSION }}-android-binaries
          path: dist/bin/*

      - name: Create prerelease
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}-android
          name: Astra ${{ env.VERSION }} (Android)
          prerelease: true
          files: dist/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
