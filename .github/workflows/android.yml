name: Build Astra for Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download Network Weight File
        run: |
          WEIGHTS_FILE="weights-v5-perm.nnue"
          WEIGHTS_URL="https://github.com/h1me01/Astra-Networks/releases/download/weights/${WEIGHTS_FILE}"
          curl -sL "$WEIGHTS_URL" -o "$WEIGHTS_FILE"

      - name: Setup SIMDe and Globally Patch x86 Headers & Shifts for ARM64
        run: |
          # Download SIMDe headers to root directory
          git clone --depth 1 https://github.com/simd-everywhere/simde.git

          python3 -c '
          import os

          x86_headers = [
              "<immintrin.h>", "<xmmintrin.h>", "<emmintrin.h>", 
              "<mmintrin.h>", "<nmmintrin.h>", "<smmintrin.h>", 
              "<tmmintrin.h>", "<pmmintrin.h>"
          ]

          def patch_file(path):
              if "simde" in path.split(os.sep):
                  return

              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              original = content

              # Globally replace any x86 intrinsic header with SIMDe equivalents on ARM64
              for header in x86_headers:
                  target = f"#include {header}"
                  if target in content:
                      simde_block = f"""#if defined(__aarch64__) || defined(__ARM_NEON)
          #define SIMDE_ENABLE_NATIVE_ALIASES
          #include "simde/x86/avx2.h"
          #include "simde/x86/fma.h"
          #else
          {target}
          #endif"""
                      content = content.replace(target, simde_block)

              # Patch simd.h for ARM64 vector types and safe shift switch-cases
              if "simd.h" in path.lower():
                  content = content.replace(
                      "#elif defined(__AVX2__) || defined(__AVX__)",
                      "#elif defined(__AVX2__) || defined(__AVX__) || defined(__aarch64__) || defined(__ARM_NEON)"
                  )

                  # Inject switch-case macros for shifts requiring compile-time constants on ARM NEON
                  shift_helpers = """
          #if defined(__aarch64__) || defined(__ARM_NEON)
          #define ASTRA_SW_SH16(op, a, imm) \\
              switch(imm) { \\
                  case 0: return op(a, 0); case 1: return op(a, 1); case 2: return op(a, 2); case 3: return op(a, 3); \\
                  case 4: return op(a, 4); case 5: return op(a, 5); case 6: return op(a, 6); case 7: return op(a, 7); \\
                  case 8: return op(a, 8); case 9: return op(a, 9); case 10: return op(a, 10); case 11: return op(a, 11); \\
                  case 12: return op(a, 12); case 13: return op(a, 13); case 14: return op(a, 14); case 15: return op(a, 15); \\
                  default: return op(a, 0); \\
              }
          #define ASTRA_SW_SH32(op, a, imm) \\
              switch(imm) { \\
                  case 0: return op(a, 0); case 1: return op(a, 1); case 2: return op(a, 2); case 3: return op(a, 3); \\
                  case 4: return op(a, 4); case 5: return op(a, 5); case 6: return op(a, 6); case 7: return op(a, 7); \\
                  case 8: return op(a, 8); case 9: return op(a, 9); case 10: return op(a, 10); case 11: return op(a, 11); \\
                  case 12: return op(a, 12); case 13: return op(a, 13); case 14: return op(a, 14); case 15: return op(a, 15); \\
                  case 16: return op(a, 16); case 17: return op(a, 17); case 18: return op(a, 18); case 19: return op(a, 19); \\
                  case 20: return op(a, 20); case 21: return op(a, 21); case 22: return op(a, 22); case 23: return op(a, 23); \\
                  case 24: return op(a, 24); case 25: return op(a, 25); case 26: return op(a, 26); case 27: return op(a, 27); \\
                  case 28: return op(a, 28); case 29: return op(a, 29); case 30: return op(a, 30); case 31: return op(a, 31); \\
                  default: return op(a, 0); \\
              }
          #endif
          """
                  content = shift_helpers + content
                  
                  # Replace shift implementations to use the switch helpers on ARM64
                  content = content.replace("return _mm256_slli_epi16(a, imm);", "#if defined(__aarch64__) || defined(__ARM_NEON)\n    ASTRA_SW_SH16(_mm256_slli_epi16, a, imm)\n#else\n    return _mm256_slli_epi16(a, imm);\n#endif")
                  content = content.replace("return _mm256_srli_epi16(a, imm);", "#if defined(__aarch64__) || defined(__ARM_NEON)\n    ASTRA_SW_SH16(_mm256_srli_epi16, a, imm)\n#else\n    return _mm256_srli_epi16(a, imm);\n#endif")
                  content = content.replace("return _mm256_srai_epi16(a, imm);", "#if defined(__aarch64__) || defined(__ARM_NEON)\n    ASTRA_SW_SH16(_mm256_srai_epi16, a, imm)\n#else\n    return _mm256_srai_epi16(a, imm);\n#endif")
                  content = content.replace("return _mm256_slli_epi32(a, imm);", "#if defined(__aarch64__) || defined(__ARM_NEON)\n    ASTRA_SW_SH32(_mm256_slli_epi32, a, imm)\n#else\n    return _mm256_slli_epi32(a, imm);\n#endif")
                  content = content.replace("return _mm256_srli_epi32(a, imm);", "#if defined(__aarch64__) || defined(__ARM_NEON)\n    ASTRA_SW_SH32(_mm256_srli_epi32, a, imm)\n#else\n    return _mm256_srli_epi32(a, imm);\n#endif")
                  content = content.replace("return _mm256_srai_epi32(a, imm);", "#if defined(__aarch64__) || defined(__ARM_NEON)\n    ASTRA_SW_SH32(_mm256_srai_epi32, a, imm)\n#else\n    return _mm256_srai_epi32(a, imm);\n#endif")

              # Patch util.h for _mm_malloc / _mm_free and std::aligned_alloc fallbacks
              if "util.h" in path.lower() or "util.hpp" in path.lower():
                  if "_mm_malloc" in content or "aligned_alloc" in content:
                      mm_malloc_fallback = """#if defined(__aarch64__) || defined(__ARM_NEON)
          #include <stdlib.h>
          #include <malloc.h>
          inline void* _mm_malloc(size_t size, size_t alignment) {
              void* ptr = nullptr;
              if (posix_memalign(&ptr, alignment, size) != 0) return nullptr;
              return ptr;
          }
          inline void _mm_free(void* ptr) {
              free(ptr);
          }
          #endif
          """
                      content = mm_malloc_fallback + content

                  if "std::aligned_alloc" in content:
                      content = content.replace(
                          "ptr = std::aligned_alloc(Alignment, std::max(alignedBytes, Alignment));",
                          "posix_memalign(&ptr, Alignment, std::max(alignedBytes, Alignment));"
                      )

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched: {path}")

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".h", ".hpp", ".cpp", ".cc", ".c")):
                      patch_file(os.path.join(root, file))
          '

      - name: Build Astra for Android ARM64
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"

          # Collect Astra source files
          SOURCES=$(find src -type f \( -name "*.cpp" -o -name "*.cc" \))

          echo "Compiling Astra for Android ARM64..."
          $NDK_CXX -O3 -flto -std=c++20 -pthread \
            -march=armv8.2-a+dotprod+crypto \
            -funroll-loops -fomit-frame-pointer -fno-exceptions \
            -DNDEBUG -static-libstdc++ \
            -DNNUE_PATH=\"weights-v5-perm.nnue\" \
            -I. -Isrc -I./simde \
            $SOURCES -lm -o astra-android-arm64

          mkdir -p dist/bin
          mv astra-android-arm64 dist/bin/

      - name: Verify Android Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-android-arm64
          path: dist/bin/*
